spring:
  # ===== DATASOURCE PROD =====
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      pool-name: GestionServiceHikariPool-Prod

  jpa:
    show-sql: false

# ===== LOGGING PROD =====
logging:
  level:
    com.example.gestionservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: logs/gestion-service-api.log

# ===== SWAGGER désactivé en PROD =====
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# ===== ACTUATOR PROD (health only) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
