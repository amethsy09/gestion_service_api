spring:
  application:
    name: gestion-service-api

  profiles:
    active: dev

  config:
    import: optional:file:./application-secrets.yml

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
    open-in-view: false

  # ===== FLYWAY =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ===== JACKSON =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# ===== SERVER =====
server:
  port: 8080
  servlet:
    context-path: /

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Gestion Service API
    version: 1.0.0
    description: Microservice de gestion de services et prestations

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# ===== WALLET SERVICE =====
wallet-service:
  url: ${WALLET_SERVICE_URL:http://localhost:8081}

# ===== WALLET INTERNAL API KEY (service-to-service auth) =====
wallet:
  internal:
    api:
      key: ${WALLET_INTERNAL_API_KEY:#{null}}

# ===== FEIGN =====
spring.cloud.openfeign:
  client:
    config:
      wallet-service:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic

# ===== LOGGING =====
logging:
  level:
    com.example.gestionservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===== SPRINGDOC / SWAGGER =====
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    groups-order: asc
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.example.gestionservice.controller
  show-actuator: false
