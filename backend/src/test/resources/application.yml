spring:
  datasource:
    url: jdbc:tc:postgresql:16://localhost/gestion_service_test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test_secret_key_for_junit_tests_32_chars_min
  issuer: gestion-service
  expiration: 3600000

# ===== ADMIN SEED =====
# Désactivé par défaut : les tests d'intégration d'auth ne doivent pas
# voir apparaître un compte ADMIN. AdminSeederIntegrationTest le réactive
# explicitement via @SpringBootTest(properties = ...).
admin:
  seed:
    enabled: false

wallet-service:
  url: http://localhost:9090

wallet:
  internal:
    api:
       key: test_wallet_internal_key

# ===== MAIL (test) =====
spring:
  mail:
    username: test@example.com
    password: test_password_not_real

logging:
  level:
    com.example.gestionservice: DEBUG
